<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arthur XP">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#245edc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Arthur XP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#000;font-family:Tahoma,Verdana,Segoe UI,sans-serif;font-size:13px;overscroll-behavior:none}
textarea,input{-webkit-user-select:text;user-select:text}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:flex}

/* ---------- BOOT ---------- */
#boot{background:#000;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:28px}
.logo{display:flex;align-items:center;gap:12px}
.orb{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 8%,#ffd25a 18%,#ff8a1f 45%,#c4450b 75%);box-shadow:0 0 30px #ff8a1f88;position:relative}
.orb:after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid #3d8cff;border-left-color:transparent;border-bottom-color:transparent;transform:rotate(-20deg)}
.logo-txt{font-family:Verdana,sans-serif;font-size:30px;font-weight:bold;letter-spacing:-1px}
.logo-txt sup{color:#ff8a1f;font-size:20px;font-style:italic;margin-left:3px}
.logo-sub{font-size:11px;opacity:.7;letter-spacing:2px;text-align:center;margin-top:-18px}
.bar{width:160px;height:18px;border:2px solid #b2b2b2;border-radius:4px;padding:2px;overflow:hidden;position:relative}
.bar i{position:absolute;top:2px;width:9px;height:10px;border-radius:2px;background:linear-gradient(#a8c8ff,#2f62e3 50%,#a8c8ff);animation:slide 1.6s linear infinite}
.bar i:nth-child(2){animation-delay:.12s}.bar i:nth-child(3){animation-delay:.24s}
@keyframes slide{from{left:-30px}to{left:170px}}
.boot-foot{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));font-size:11px;opacity:.5}

/* ---------- LOGIN ---------- */
#login{background:#5a7edc;flex-direction:column}
.lg-top,.lg-bot{height:72px;background:#00309c;flex-shrink:0}
.lg-top{border-bottom:2px solid #f99736;padding-top:env(safe-area-inset-top)}
.lg-bot{border-top:2px solid #94b0ec;display:flex;align-items:center;padding:0 20px env(safe-area-inset-bottom);color:#fff;gap:10px}
.lg-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(ellipse at 20% 20%,#8daaf0 0,#5a7edc 60%)}
.lg-mid .logo-txt{font-size:26px;color:#fff}
.lg-hint{color:#fff;font-size:15px}
.user{display:flex;align-items:center;gap:14px;padding:10px 18px 10px 10px;border-radius:8px;cursor:pointer;background:linear-gradient(90deg,#00309c66,transparent);border:1px solid transparent}
.user:active{background:linear-gradient(90deg,#00309c,#5a7edc)}
.avatar{width:54px;height:54px;border-radius:5px;border:3px solid #fff;background:linear-gradient(135deg,#ffcf4d,#ff7a1a);display:grid;place-items:center;font-size:30px}
.user b{color:#fff;font-size:20px;font-weight:normal}
.pwr{width:26px;height:26px;border-radius:5px;background:linear-gradient(#ff8a5c,#d43a0c);display:grid;place-items:center;border:1px solid #fff;font-weight:bold}

/* ---------- DESKTOP ---------- */
#desktop{flex-direction:column}
#wall{position:absolute;inset:0;transition:filter 1s}
.w-colline{background:
 radial-gradient(ellipse 140% 55% at 30% 105%,#3f9a1f 0 55%,transparent 56%),
 radial-gradient(ellipse 120% 50% at 85% 110%,#55b52a 0 55%,transparent 56%),
 radial-gradient(ellipse 60% 18% at 25% 25%,#ffffffcc,transparent 70%),
 radial-gradient(ellipse 40% 12% at 75% 15%,#ffffffaa,transparent 70%),
 linear-gradient(#1f62d6,#5d9cf2 45%,#a8d1ff 70%)}
.w-nuit{background:radial-gradient(circle at 75% 20%,#fff8 0 1.5%,transparent 4%),radial-gradient(ellipse 140% 50% at 50% 110%,#0d2a10 0 55%,transparent 56%),linear-gradient(#020824,#16306b 60%,#3a4f9a)}
.w-coucher{background:radial-gradient(circle at 50% 62%,#fff3b0 0 6%,#ffb347 12%,transparent 30%),radial-gradient(ellipse 140% 45% at 50% 110%,#3b1d3a 0 55%,transparent 56%),linear-gradient(#2b2f77,#d0507a 50%,#ffb347 70%)}
.w-bleu{background:linear-gradient(135deg,#245edb,#3a80f3 50%,#0b3fb3)}
.w-archange{background:radial-gradient(circle at 50% 30%,#fff 0 4%,#ffe9a8 12%,transparent 40%),radial-gradient(ellipse 160% 40% at 50% 115%,#fff 0 50%,transparent 52%),linear-gradient(#ffd56b,#f5a64a 40%,#8d6fd8)}
#icons{position:absolute;top:calc(10px + env(safe-area-inset-top));left:6px;bottom:50px;display:flex;flex-direction:column;flex-wrap:wrap;gap:6px;align-content:flex-start}
.ico{width:78px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:3px}
.ico span:first-child{font-size:34px;line-height:1;filter:drop-shadow(1px 2px 1px #0006)}
.ico span:last-child{color:#fff;text-align:center;font-size:12px;text-shadow:1px 1px 2px #000,0 0 2px #000;line-height:1.2;padding:1px 2px}
.ico.sel span:last-child{background:#316ac5}
.ico.sel span:first-child{filter:drop-shadow(1px 2px 1px #0006) brightness(.7) sepia(1) hue-rotate(190deg) saturate(3)}

/* ---------- TASKBAR ---------- */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:calc(40px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:linear-gradient(#3c81f3,#245edc 10%,#245edc 85%,#1941a5);border-top:1px solid #0c59b9;z-index:9000}
#startbtn{height:40px;padding:0 18px 0 10px;display:flex;align-items:center;gap:6px;color:#fff;font-style:italic;font-weight:bold;font-size:17px;text-shadow:1px 1px 2px #0008;background:linear-gradient(#5eac56,#3c9a33 15%,#2f8a26 85%,#1e6a18);border-radius:0 12px 12px 0;box-shadow:inset -2px 0 3px #0005;cursor:pointer;flex-shrink:0}
#startbtn.on{background:linear-gradient(#2f7a28,#1e6a18 40%,#2f8a26)}
#startbtn .mini{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 10%,#ffd25a 25%,#ff8a1f 55%,#c4450b)}
#tasks{flex:1;display:flex;gap:3px;padding:4px;overflow-x:auto;min-width:0}
.tbtn{flex:0 1 140px;min-width:44px;height:32px;border-radius:3px;display:flex;align-items:center;gap:5px;padding:0 7px;color:#fff;background:linear-gradient(#3c8af7,#2b6fe8);border:1px solid #1941a5;box-shadow:inset 1px 1px #ffffff40;cursor:pointer;white-space:nowrap;overflow:hidden;font-size:12px}
.tbtn.act{background:linear-gradient(#1e52b7,#1c4ab0);box-shadow:inset 1px 1px 3px #0008}
.tbtn em{font-style:normal;font-size:15px}.tbtn b{font-weight:normal;overflow:hidden;text-overflow:ellipsis}
#tray{display:flex;align-items:center;gap:8px;padding:0 12px;color:#fff;background:linear-gradient(#0c8be8,#139ee9 15%,#18a5f0 85%,#0c80d7);border-left:1px solid #092e84;box-shadow:inset 1px 0 #ffffff40;flex-shrink:0;height:40px}

/* ---------- START MENU ---------- */
#start{position:absolute;left:0;bottom:calc(40px + env(safe-area-inset-bottom));width:min(380px,100vw);border-radius:8px 8px 0 0;overflow:hidden;box-shadow:3px 0 10px #0008;z-index:9500;display:none;border:1px solid #1941a5;border-bottom:0}
#start.on{display:block}
.sm-head{height:62px;display:flex;align-items:center;gap:10px;padding:0 10px;background:linear-gradient(#1868ce,#0e60cb 50%,#1868ce);border-bottom:2px solid #f99736;color:#fff;font-weight:bold;font-size:16px;text-shadow:1px 1px 2px #000}
.sm-head .avatar{width:44px;height:44px;font-size:24px;border-width:2px}
.sm-body{display:flex;background:#fff}
.sm-l,.sm-r{padding:6px 0}
.sm-l{flex:1.1;background:#fff}
.sm-r{flex:1;background:#d3e5fa;border-left:1px solid #95bdee}
.sm-i{display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer}
.sm-i:active,.sm-i:hover{background:#316ac5;color:#fff}
.sm-i em{font-style:normal;font-size:24px;width:30px;text-align:center}
.sm-l .sm-i b{display:block}.sm-i small{font-size:11px;opacity:.7}
.sm-r .sm-i{font-weight:bold;color:#0a246a}.sm-r .sm-i em{font-size:20px}
.sm-sep{height:1px;margin:4px 8px;background:linear-gradient(90deg,transparent,#aaa,transparent)}
.sm-foot{height:46px;display:flex;justify-content:flex-end;align-items:center;gap:14px;padding:0 10px;background:linear-gradient(#1868ce,#0e60cb)}
.sm-foot div{display:flex;align-items:center;gap:5px;color:#fff;cursor:pointer}
.sq{width:24px;height:24px;border-radius:4px;border:1px solid #fff;display:grid;place-items:center;font-size:13px}
.sq.y{background:linear-gradient(#ffc75a,#e88a10)}.sq.r{background:linear-gradient(#ff8a5c,#d43a0c)}

/* ---------- WINDOWS ---------- */
.win{position:absolute;display:flex;flex-direction:column;background:#ece9d8;border:3px solid #0831d9;border-top:0;border-radius:8px 8px 0 0;box-shadow:2px 3px 12px #0007;min-width:200px}
.win.inactive{border-color:#7a96df}
.win.inactive .tb{background:linear-gradient(#9db9eb,#7a96df)}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 40px - env(safe-area-inset-bottom))!important;border-radius:0}
.win.min{display:none}
.tb{height:32px;flex-shrink:0;display:flex;align-items:center;gap:5px;padding:0 3px 0 6px;color:#fff;font-weight:bold;font-size:13px;text-shadow:1px 1px #0a1f6c;border-radius:7px 7px 0 0;background:linear-gradient(#0997ff,#0053ee 8%,#0050ee 40%,#06f 88%,#06f 93%,#005bff 95%,#003dd7);touch-action:none;cursor:move;margin:0 -3px}
.win.max .tb{border-radius:0;padding-top:0}
.tb em{font-style:normal;font-size:15px}
.tb b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{width:26px;height:24px;border-radius:3px;border:1px solid #fff;display:grid;place-items:center;font-size:14px;font-weight:bold;cursor:pointer;background:linear-gradient(135deg,#3c8af7,#1653e3);box-shadow:inset 1px 1px #ffffff60;text-shadow:none}
.wb.x{background:linear-gradient(135deg,#e5806a,#c33c14)}
.wb:active{filter:brightness(.8)}
.menu{display:flex;gap:2px;padding:2px 4px;border-bottom:1px solid #d1cfc0;font-size:12px;flex-shrink:0}
.menu span{padding:2px 6px}
.body{flex:1;overflow:auto;position:relative;min-height:0}
.btn{padding:5px 12px;border:1px solid #003c74;border-radius:3px;background:linear-gradient(#fff,#ece9d8 85%,#d6d0c5);font:inherit;cursor:pointer;color:#000}
.btn:active{background:linear-gradient(#d6d0c5,#ece9d8)}

/* apps */
.note{width:100%;height:100%;border:0;resize:none;padding:6px;font:14px "Lucida Console",Courier,monospace;outline:none}
.calc{padding:8px;display:flex;flex-direction:column;gap:8px}
.calc-d{background:#fff;border:2px inset #ccc;padding:6px 8px;text-align:right;font-size:26px;font-family:"Lucida Console",monospace;overflow:hidden;white-space:nowrap}
.calc-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-g .btn{height:42px;font-size:17px;padding:0}
.calc-g .op{color:#c00}.calc-g .eq{grid-row:span 2;height:auto}.calc-g .z{grid-column:span 2}
.mines{padding:8px;display:flex;flex-direction:column;align-items:center;gap:8px}
.m-top{display:flex;justify-content:space-between;align-items:center;width:100%;border:2px inset #ccc;padding:4px 6px;background:#c0c0c0}
.lcd{background:#000;color:#f00;font:bold 22px "Courier New",monospace;padding:0 4px;min-width:50px;text-align:center}
.smile{width:36px;height:36px;font-size:22px;border:2px outset #fff;background:#c0c0c0;display:grid;place-items:center;cursor:pointer}
.m-grid{display:grid;grid-template-columns:repeat(9,32px);border:3px inset #ddd;background:#c0c0c0;touch-action:manipulation}
.c{width:32px;height:32px;border:3px outset #fff;background:#c0c0c0;display:grid;place-items:center;font:bold 17px Verdana;cursor:pointer}
.c.o{border:1px solid #888;border-width:0 1px 1px 0}
.c.boom{background:#f00}
.n1{color:#00f}.n2{color:#080}.n3{color:#f00}.n4{color:#008}.n5{color:#800}.n6{color:#088}.n7{color:#000}.n8{color:#888}
.flagmode{font-size:12px}
.paint{display:flex;flex-direction:column;height:100%}
.p-tools{display:flex;flex-wrap:wrap;gap:4px;padding:5px;border-bottom:1px solid #aaa;align-items:center}
.sw{width:24px;height:24px;border:2px inset #fff;cursor:pointer}
.sw.on{outline:2px solid #000;outline-offset:1px}
.p-can{flex:1;background:#808080;padding:4px;min-height:0}
.p-can canvas{background:#fff;width:100%;height:100%;touch-action:none;display:block}
.expl{display:flex;height:100%}
.ex-side{width:150px;background:linear-gradient(#7ba2e7,#6375d6);padding:8px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.ex-box{background:#fff;border-radius:4px 4px 0 0;overflow:hidden}
.ex-box h4{background:linear-gradient(90deg,#fff,#c6d3f7);color:#215dc6;font-size:12px;padding:5px 8px}
.ex-box p{padding:6px 8px;font-size:11px;color:#215dc6;line-height:1.7}
.ex-main{flex:1;background:#fff;padding:10px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.ex-it{width:84px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;font-size:12px;cursor:pointer;padding:3px;border-radius:3px}
.ex-it:active{background:#316ac5;color:#fff}
.ex-it span:first-child{font-size:34px}
.addr{display:flex;align-items:center;gap:6px;padding:3px 6px;font-size:12px;border-bottom:1px solid #d1cfc0;flex-shrink:0}
.addr div{flex:1;background:#fff;border:1px solid #7f9db9;padding:2px 5px}
.set{padding:12px;display:flex;flex-direction:column;gap:12px}
.preview{height:120px;border:8px solid #333;border-radius:6px 6px 0 0;position:relative}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.wl div{height:60px;border:2px solid #fff;outline:1px solid #888;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;font-size:11px;color:#fff;text-shadow:1px 1px 2px #000;padding-bottom:2px}
.wl div.on{outline:3px solid #316ac5}
.about{padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;line-height:1.5}
.dlg{padding:14px;display:flex;gap:12px;align-items:flex-start}
.dlg-b{display:flex;justify-content:center;gap:8px;padding:0 14px 14px}

/* browser */
.web{display:flex;flex-direction:column;height:100%}
.w-tool{display:flex;gap:3px;padding:3px 4px;border-bottom:1px solid #d1cfc0;flex-shrink:0;align-items:center}
.w-tool button{border:1px solid transparent;background:none;font:inherit;padding:2px 6px;border-radius:3px;cursor:pointer;display:flex;align-items:center;gap:3px;color:#000}
.w-tool button:active{border-color:#aaa;background:#fff}
.w-tool button:disabled{opacity:.35}
.w-tool .g{width:22px;height:22px;border-radius:50%;color:#fff;font-weight:bold;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#9fe08a,#2e9a1e)}
.w-addr{display:flex;align-items:center;gap:4px;padding:3px 4px;border-bottom:1px solid #d1cfc0;flex-shrink:0;font-size:12px}
.w-addr form{flex:1;display:flex;gap:4px}
.w-addr input{flex:1;min-width:0;border:1px solid #7f9db9;padding:3px 5px;font:13px Tahoma,Verdana,sans-serif;outline:none}
.w-page{flex:1;overflow:auto;background:#fff;min-height:0;-webkit-overflow-scrolling:touch}
.w-page *{-webkit-user-select:text;user-select:text}
.w-stat{height:22px;flex-shrink:0;border-top:1px solid #d1cfc0;font-size:11px;display:flex;align-items:center;padding:0 6px;gap:6px;color:#333}
.w-page a{color:#00c;cursor:pointer;text-decoration:underline}
.pg{padding:16px;line-height:1.5;font-family:Arial,Verdana,sans-serif}
.s-home{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 16px}
.s-logo{font:bold 40px Georgia,serif;letter-spacing:-1px}
.s-logo i{font-style:normal}
.s-box{display:flex;gap:6px;width:100%;max-width:420px}
.s-box input{flex:1;min-width:0;border:1px solid #999;padding:6px;font-size:15px}
.s-res{margin:12px 0}
.s-res .u{color:#080;font-size:12px}
.perso{background:#000 radial-gradient(#fff 1px,transparent 1px) 0 0/22px 22px;color:#0f0;font-family:"Comic Sans MS","Chalkboard SE",cursive;text-align:center;padding:14px;min-height:100%}
.perso h1{color:#ff0;font-size:26px;text-shadow:2px 2px #f0f}
.perso .blink{animation:blink 1s steps(1) infinite;color:#f0f}
@keyframes blink{50%{opacity:0}}
.marq{overflow:hidden;white-space:nowrap;background:#00f;color:#fff;padding:3px 0;margin:10px 0}
.marq span{display:inline-block;padding-left:100%;animation:marq 12s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}
.cnt{display:inline-block;background:#222;border:2px ridge #888;color:#f00;font:bold 18px "Courier New";padding:2px 8px;letter-spacing:3px}
.gb{background:#002;border:2px dashed #0ff;margin:10px auto;max-width:420px;padding:8px;text-align:left;color:#0ff}
.gb input,.gb textarea{width:100%;margin:3px 0;font:13px Verdana;padding:4px}
.gb .e{border-top:1px dotted #0ff;padding:5px 0;color:#fff;font-size:13px}
.err{padding:20px;font-family:Tahoma,Verdana;line-height:1.6}
.err h2{color:#000;font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.err hr{border:0;border-top:1px solid #999;margin:10px 0}
.gamecard{display:flex;gap:10px;align-items:center;border:1px solid #ccc;border-radius:6px;padding:10px;margin:8px 0;background:#f7f9ff}
.gamecard span{font-size:36px}
.runner canvas{width:100%;max-width:520px;height:170px;border:1px solid #ccc;display:block;margin:8px auto;touch-action:manipulation;background:#fff}

/* cmd */
.cmd{background:#000;color:#c0c0c0;font:13px/1.35 "Lucida Console","Courier New",monospace;height:100%;overflow:auto;padding:6px;white-space:pre-wrap;word-break:break-all}
.cmd *{-webkit-user-select:text;user-select:text}
.cmd .ln{display:flex}
.cmd input{flex:1;min-width:0;background:none;border:0;outline:none;color:inherit;font:inherit;padding:0;caret-color:currentColor}

/* ---------- SHUTDOWN ---------- */
#shut{position:fixed;inset:0;z-index:9900;display:none;align-items:center;justify-content:center;background:#0005}
#shut.on{display:flex}
.sh-box{width:min(320px,92vw);border-radius:6px;overflow:hidden;box-shadow:0 5px 25px #000}
.sh-h{background:#00309c;color:#fff;padding:12px 14px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.sh-m{background:linear-gradient(#7ea2f1,#5a7edc);display:flex;justify-content:space-around;padding:22px 6px;border-top:2px solid #94b0ec;border-bottom:2px solid #94b0ec}
.sh-m div{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;cursor:pointer;font-size:12px}
.sh-m .sq{width:38px;height:38px;font-size:20px;border-radius:6px}
.sq.g{background:linear-gradient(#a3e07a,#3c9a33)}
.sh-f{background:#00309c;padding:10px 14px;text-align:right}
#off{background:#000;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot" class="screen">
  <div class="logo"><div class="orb"></div><div class="logo-txt">Arthur<sup>xp</sup></div></div>
  <div class="logo-sub">ÉDITION FAMILIALE</div>
  <div class="bar"><i></i><i></i><i></i></div>
  <div class="boot-foot">Copyright © Arthur Corp. Fait avec Claude.</div>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <div class="lg-top"></div>
  <div class="lg-mid">
    <div class="logo"><div class="orb" style="width:44px;height:44px"></div><div class="logo-txt">Arthur<sup>xp</sup></div></div>
    <div class="lg-hint">Pour commencer, touchez votre nom d'utilisateur</div>
    <div class="user" id="userBtn"><div class="avatar">🦊</div><b>Arthur</b></div>
  </div>
  <div class="lg-bot"><div class="pwr" id="lgOff">⏻</div><span>Éteindre l'ordinateur</span></div>
</div>

<!-- DESKTOP -->
<div id="desktop" class="screen">
  <div id="wall"></div>
  <div id="icons"></div>
  <div id="start">
    <div class="sm-head"><div class="avatar">🦊</div>Arthur</div>
    <div class="sm-body">
      <div class="sm-l" id="smL"></div>
      <div class="sm-r" id="smR"></div>
    </div>
    <div class="sm-foot">

 const t=t0+i*.16;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.15,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+dur+.6);o.start(t);o.stop(t+dur+.7)})}catch(e){}}

 wins[k]={el,tbtn};

}

 const show=()=>d.textContent=cur.length>14?(+cur).toPrecision(9):cur;
 const calc=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:b===0?NaN:a/b;
 keys.forEach(k=>{const x=document.createElement('button');x.className='btn'+('÷×−+'.includes(k)?' op':'')+(k==='='?' eq op':'')+(k==='0'?' z':'');x.textContent=k;

   else if(k==='←'){cur=cur.length>1?cur.slice(0,-1):'0'}
   else if(k==='='){if(op!==null){cur=String(+calc(acc,+cur,op).toFixed(10));if(cur==='NaN')cur='Erreur';acc=null;op=null;fresh=true}}

function mkMines(b,w){const N=9,M=10;b.innerHTML=`<div class="mines"><div class="m-top"><div class="lcd" id="mc">010</div><div class="smile">🙂</div><div class="lcd" id="mt">000</div></div><div class="m-grid"></div><button class="btn flagmode">Mode : ⛏️ Creuser</button><div style="font-size:11px;color:#555;text-align:center">Appui long = poser un drapeau 🚩</div></div>`;
 const grid=b.querySelector('.m-grid'),sm=b.querySelector('.smile'),mc=b.querySelector('#mc'),mt=b.querySelector('#mt'),fm=b.querySelector('.flagmode');
 let cells,started,over,flags,timer,secs,opened,flagMode=false;
 fm.onclick=()=>{flagMode=!flagMode;fm.textContent='Mode : '+(flagMode?'🚩 Drapeau':'⛏️ Creuser')};
 const pad=n=>String(Math.max(0,n)).padStart(3,'0');
 function reset(){clearInterval(timer);cells=[];started=over=false;flags=0;secs=0;opened=0;sm.textContent='🙂';mc.textContent=pad(M);mt.textContent='000';grid.innerHTML='';
  for(let i=0;i<N*N;i++){const el=document.createElement('div');el.className='c';const c={i,mine:false,n:0,o:false,f:false,el};cells.push(c);
   let lp,moved=false;el.onpointerdown=()=>{moved=false;lp=setTimeout(()=>{lp=null;flag(c)},420)};
   el.onpointerup=()=>{if(lp){clearTimeout(lp);lp=null;flagMode?flag(c):reveal(c)}};el.onpointerleave=()=>{if(lp){clearTimeout(lp);lp=null}};
   el.oncontextmenu=e=>e.preventDefault();grid.appendChild(el)}}
 const nb=c=>{const r=~~(c.i/N),q=c.i%N,o=[];for(let dr=-1;dr<2;dr++)for(let dq=-1;dq<2;dq++){if(!dr&&!dq)continue;const R=r+dr,Q=q+dq;if(R>=0&&R<N&&Q>=0&&Q<N)o.push(cells[R*N+Q])}return o};
 function place(safe){const ban=new Set([safe.i,...nb(safe).map(c=>c.i)]);let k=0;while(k<M){const c=cells[~~(Math.random()*N*N)];if(!c.mine&&!ban.has(c.i)){c.mine=true;k++}}
  cells.forEach(c=>c.n=nb(c).filter(x=>x.mine).length)}
 function flag(c){if(over||c.o)return;c.f=!c.f;flags+=c.f?1:-1;c.el.textContent=c.f?'🚩':'';mc.textContent=pad(M-flags);try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}}
 function reveal(c){if(over||c.f||c.o)return;
  if(!started){started=true;place(c);timer=setInterval(()=>{secs++;mt.textContent=pad(Math.min(999,secs))},1000)}
  if(c.mine){over=true;clearInterval(timer);sm.textContent='😵';c.el.classList.add('boom');cells.forEach(x=>{if(x.mine){x.el.textContent='💣';x.el.classList.add('o')}});sndErr();return}

  if(opened===N*N-M){over=true;clearInterval(timer);sm.textContent='😎';cells.forEach(x=>{if(x.mine)x.el.textContent='🚩'});sndStart();
   const best=store.get('mineBest',null);if(best===null||secs<best){store.set('mineBest',secs);setTimeout(()=>msg('Démineur','🏆',`Bravo Arthur ! Nouveau record : <b>${secs} s</b>`),400)}}}

   if(p){print(`\n[+] Trouvé : ${h} → ${p}`);tip('« password » fait partie des mots de passe les plus utilisés au monde, il est cassé instantanément. Flag : FLAG{'+p+'}')}else print('\n[-] Aucun mot de passe trouvé dans la liste.');return}
  if(low==='nmap'){if(!arg.includes(IP)){print('Utilisation : nmap '+IP);return}
   print(`Starting Nmap 7.94\nNmap scan report for ${IP}\nPORT   STATE SERVICE\n21/tcp open  ftp     (vsftpd 3.0.5)\n22/tcp open  ssh     (OpenSSH 8.9)\n80/tcp open  http    (Apache 2.4)\n\nNmap done: 1 IP address scanned`);tip('3 ports ouverts = 3 portes d\'entrée possibles : FTP (fichiers), SSH (connexion à distance) et HTTP (site web).');return}
  if(low==='ftp'){if(!arg.includes(IP)){print('Utilisation : ftp '+IP);return}print('Connected to '+IP+'.\n220 (vsFTPd 3.0.5)\nName: anonymous');secret='ftp';H.secret=false;H.handle('');return}
  if(low==='gobuster'||low==='dirb'){if(!arg.includes(IP)){print('Utilisation : gobuster http://'+IP);return}
   print('Gobuster v3.6 — recherche de dossiers…\n/index.html   (Status: 200)\n/secret       (Status: 200)\n/admin        (Status: 403)\n/server-status (Status: 403)');tip('gobuster teste des milliers de noms de dossiers. « Caché » ne veut pas dire « protégé » !');return}
  if(low==='curl'||low==='wget'){if(!arg.includes(IP)){print('Utilisation : curl http://'+IP);return}
   if(/secret/.test(arg)){print('<html>\n<h1>Mes photos 🐱</h1>\n<img src="chat.jpg">\n<p>Voici Biscuit, le chat de lutin. Il est né en 2019 !</p>\n</html>');return}

   print('<html>\n<h1>Bienvenue chez le Dr Pomme 🍎</h1>\n<p>Site en construction.</p>\n<!-- TODO : supprimer le dossier de photos -->\n</html>');return}
  if(low==='ssh'){if(!/^lutin@/.test(arg)){print(arg.includes('@')?'Permission denied (utilisateur inconnu).':'Utilisation : ssh utilisateur@'+IP);return}secret='ssh';H.secret=true;print(`${arg}'s password:`);return}
  if(low==='sudo'){print('arthur n\'a pas besoin de sudo ici. Connecte-toi d\'abord à la cible.');return}
  print(cmd+': commande introuvable (tape help)')};
